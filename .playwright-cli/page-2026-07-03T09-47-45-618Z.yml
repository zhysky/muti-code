          - heading "十、行业整体趋势（2025-2026）" [level=2] [ref=e401]
          - heading "1. OLTP 方向：从 MySQL Sharding 到原生分布式" [level=3] [ref=e402]
          - list [ref=e403]:
            - listitem [ref=e404]:
              - strong [ref=e405]: OceanBase / TDSQL / TiDB / PolarDB
              - text: 是国内四强，分别背靠蚂蚁、腾讯、PingCAP、阿里云。
            - listitem [ref=e406]: 大厂核心交易系统已基本完成"去 Oracle / 去 MySQL Sharding 自建"→"原生分布式数据库"转型。
          - heading "2. OLAP 方向：StarRocks / Doris 反超 ClickHouse" [level=3] [ref=e407]
          - list [ref=e408]:
            - listitem [ref=e409]:
              - text: 过去是 ClickHouse 主导，2024-2025 年
              - strong [ref=e410]: StarRocks / Doris
              - text: （国内开源项目）成为更主流选择，原因是更好的标准 SQL 兼容、湖仓联动、易运维。
            - listitem [ref=e411]: 字节（ByteHouse）、腾讯、京东、美团、拼多多都在从 ClickHouse 向 Doris/StarRocks 部分迁移。
          - heading "3. 向量数据库 + 大模型" [level=3] [ref=e412]
          - list [ref=e413]:
            - listitem [ref=e414]:
              - text: 2025 年起所有大厂都在重投向量数据库：字节
              - strong [ref=e415]: Seldra
              - text: 、腾讯
              - strong [ref=e416]: VectorDB
              - text: 、阿里
              - strong [ref=e417]: RDS Vector / AnalyticDB Vector
              - text: 、蚂蚁
              - strong [ref=e418]: Kunlun
              - text: 。
            - listitem [ref=e419]: Milvus / Weaviate 等开源方案在非核心场景被广泛采用。
          - heading "4. 湖仓一体" [level=3] [ref=e420]
          - list [ref=e421]:
            - listitem [ref=e422]:
              - strong [ref=e423]: Iceberg / Hudi + 自研查询引擎
              - text: 成为数仓新基建，字节 ByConity、腾讯 Data Lake、阿里 Paimon（已开源）都在做。
          - heading "5. 云原生与 Serverless" [level=3] [ref=e424]
          - list [ref=e425]:
            - listitem [ref=e426]: PolarDB、TDSQL-C、TiDB Cloud、OceanBase 4.x 都已全面 Serverless 化。
          - heading "6. 信创 + 国产化" [level=3] [ref=e427]
          - list [ref=e428]:
            - listitem [ref=e429]:
              - text: 党政、金融、运营商场景强制国产化数据库，
              - strong [ref=e430]: OceanBase、GaussDB（华为）、TiDB、达梦、人大金仓
              - text: 是主要受益者。
          - separator [ref=e431]
          - heading "关键观察" [level=2] [ref=e432]
          - list [ref=e433]:
            - listitem [ref=e434]:
              - strong [ref=e435]: 国内大厂的数据库"自主可控率"已经超过 70%
              - text: （金融、电信行业更高）。
            - listitem [ref=e436]:
              - strong [ref=e437]: 自研主要发生在 OLTP 核心交易
              - text: （OceanBase、TDSQL、ByteHouse），其他场景多采用开源或商业云服务。
            - listitem [ref=e438]:
              - strong [ref=e439]: 2025-2026 年最大的变化是 OLAP 的 StarRocks/Doris 化和向量数据库的全面落地
              - text: 。
