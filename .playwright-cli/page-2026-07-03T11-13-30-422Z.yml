          - heading "十、行业整体趋势（2025-2026）" [level=2] [ref=e738]
          - heading "1. OLTP 方向：从 MySQL Sharding 到原生分布式" [level=3] [ref=e739]
          - list [ref=e740]:
            - listitem [ref=e741]:
              - strong [ref=e742]: OceanBase / TDSQL / TiDB / PolarDB
              - text: 是国内四强，分别背靠蚂蚁、腾讯、PingCAP、阿里云。
            - listitem [ref=e743]: 大厂核心交易系统已基本完成"去 Oracle / 去 MySQL Sharding 自建"→"原生分布式数据库"转型。
          - heading "2. OLAP 方向：StarRocks / Doris 反超 ClickHouse" [level=3] [ref=e744]
          - list [ref=e745]:
            - listitem [ref=e746]:
              - text: 过去是 ClickHouse 主导，2024-2025 年
              - strong [ref=e747]: StarRocks / Doris
              - text: （国内开源项目）成为更主流选择，原因是更好的标准 SQL 兼容、湖仓联动、易运维。
            - listitem [ref=e748]: 字节（ByteHouse）、腾讯、京东、美团、拼多多都在从 ClickHouse 向 Doris/StarRocks 部分迁移。
          - heading "3. 向量数据库 + 大模型" [level=3] [ref=e749]
          - list [ref=e750]:
            - listitem [ref=e751]:
              - text: 2025 年起所有大厂都在重投向量数据库：字节
              - strong [ref=e752]: Seldra
              - text: 、腾讯
              - strong [ref=e753]: VectorDB
              - text: 、阿里
              - strong [ref=e754]: RDS Vector / AnalyticDB Vector
              - text: 、蚂蚁
              - strong [ref=e755]: Kunlun
              - text: 。
            - listitem [ref=e756]: Milvus / Weaviate 等开源方案在非核心场景被广泛采用。
          - heading "4. 湖仓一体" [level=3] [ref=e757]
          - list [ref=e758]:
            - listitem [ref=e759]:
              - strong [ref=e760]: Iceberg / Hudi + 自研查询引擎
              - text: 成为数仓新基建，字节 ByConity、腾讯 Data Lake、阿里 Paimon（已开源）都在做。
          - heading "5. 云原生与 Serverless" [level=3] [ref=e761]
          - list [ref=e762]:
            - listitem [ref=e763]: PolarDB、TDSQL-C、TiDB Cloud、OceanBase 4.x 都已全面 Serverless 化。
          - heading "6. 信创 + 国产化" [level=3] [ref=e764]
          - list [ref=e765]:
            - listitem [ref=e766]:
              - text: 党政、金融、运营商场景强制国产化数据库，
              - strong [ref=e767]: OceanBase、GaussDB（华为）、TiDB、达梦、人大金仓
              - text: 是主要受益者。
          - separator [ref=e768]
          - heading "关键观察" [level=2] [ref=e769]
          - list [ref=e770]:
            - listitem [ref=e771]:
              - strong [ref=e772]: 国内大厂的数据库"自主可控率"已经超过 70%
              - text: （金融、电信行业更高）。
            - listitem [ref=e773]:
              - strong [ref=e774]: 自研主要发生在 OLTP 核心交易
              - text: （OceanBase、TDSQL、ByteHouse），其他场景多采用开源或商业云服务。
            - listitem [ref=e775]:
              - strong [ref=e776]: 2025-2026 年最大的变化是 OLAP 的 StarRocks/Doris 化和向量数据库的全面落地
              - text: 。
