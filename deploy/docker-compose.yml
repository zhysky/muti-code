services:
  gateway:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: demo
      AUTH_DISABLED: "true"
      PORT: 3000
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      REDIS_URL: redis://redis:6379
      AGENT_CONFIG_DIR: /app/config
      WORKSPACE_ROOT: /workspaces
      CLAUDE_CONFIG_DIR: /runtime/claude
      CODEX_HOME: /runtime/codex
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.minimaxi.com/anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      INTERNAL_LLM_BASE_URL: ${INTERNAL_LLM_BASE_URL:-https://api.minimaxi.com/v1}
      INTERNAL_LLM_API_KEY: ${INTERNAL_LLM_API_KEY:-}
      OPENCODE_BASE_URL: http://opencode:4096
      OPENCODE_SERVER_PASSWORD: demo-password
      AGENT_DRIVER_MODE: ${AGENT_DRIVER_MODE:-mock}
    volumes:
      - ../config:/app/config
      - ../workspaces:/workspaces
      - ../data/runtime/claude:/runtime/claude
      - ../data/runtime/codex:/runtime/codex
      - ../data:/data
      - ../logs:/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opencode:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      WEB_PORT: 5173
      GATEWAY_ORIGIN: http://gateway:3000
    depends_on:
      - gateway

  opencode:
    image: node:20
    working_dir: /app
    command: >
      sh -lc "mkdir -p /root/.local/share/opencode &&
              node -e 'const fs=require(\"fs\"); const key=process.env.MINIMAX_API_KEY || \"\"; fs.writeFileSync(\"/root/.local/share/opencode/auth.json\", JSON.stringify({ minimaxi: { type: \"api\", key } }, null, 2) + \"\\n\")' &&
              npm install -g opencode-ai &&
              OPENCODE_SERVER_PASSWORD=demo-password
              opencode serve --hostname 0.0.0.0 --port 4096"
    environment:
      OPENCODE_SERVER_PASSWORD: demo-password
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    volumes:
      - ../workspaces:/workspaces
      - ../data/opencode:/home/node/.config/opencode
      - ../config/opencode.json:/root/.config/opencode/opencode.json:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
